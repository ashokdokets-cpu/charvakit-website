name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ielts-relevance:
    name: IELTS Relevance Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests python-dotenv

      - name: Check if test and secret are available
        id: check
        run: |
          if [ ! -f scripts/test_ielts_relevance.py ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Test script not found - skipping"
          elif [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::OPENAI_API_KEY secret not set - skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run IELTS relevance test
        if: steps.check.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/test_ielts_relevance.py