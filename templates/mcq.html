<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Assessment - Charvak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3ba591; }
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 60px 0; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); transition: all 0.3s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <div class="hero text-center">
        <h1 class="display-4 fw-bold">📝 MCQ Assessment</h1>
        <p class="lead">AI-Generated Unique Questions</p>
    </div>

    <div class="container py-5">
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card p-4 text-center">
                    <h4>🧮 Aptitude</h4>
                    <p class="text-muted">Quant, Logical, Data Interpretation</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4 text-center">
                    <h4>💻 Technical CS</h4>
                    <p class="text-muted">DSA, OOPs, DBMS, Networks</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4 text-center">
                    <h4>🔍 Pseudocode</h4>
                    <p class="text-muted">C, C++, Java, Python</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4 text-center">
                    <h4>🌐 Domain</h4>
                    <p class="text-muted">Cloud, Web, Security, Agile</p>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/advanced-assessment" class="btn btn-primary btn-lg rounded-pill px-5">Start MCQ Assessment</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
