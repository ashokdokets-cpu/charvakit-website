<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Assessment - Charvak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3ba591; --primary-dark: #2e8a78; }
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 60px 0; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); transition: all 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .category-card { cursor: pointer; }
        .category-card.active { border: 2px solid var(--primary); background: #f0faf8; }
        .question-box { background: #fff; border-radius: 15px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .option-item { cursor: pointer; padding: 15px; border: 1px solid #e0e0e0; border-radius: 10px; margin-bottom: 10px; transition: all 0.2s; }
        .option-item:hover { background: #f0faf8; border-color: var(--primary); }
    </style>
</head>
<body>
    <div class="hero text-center">
        <h1 class="display-4 fw-bold">📝 MCQ Assessment</h1>
        <p class="lead">AI-Generated Unique Questions</p>
    </div>

    <div class="container py-5">
        <h3 class="text-center fw-bold mb-4">Choose a Category</h3>
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card category-card text-center p-3 active" data-category="aptitude" onclick="showCategory('aptitude')">
                    <h5>🧮 Aptitude</h5>
                    <small class="text-muted">Quant, Reasoning</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card category-card text-center p-3" data-category="technical" onclick="showCategory('technical')">
                    <h5>💻 Technical CS</h5>
                    <small class="text-muted">DSA, OOPs, DBMS</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card category-card text-center p-3" data-category="pseudocode" onclick="showCategory('pseudocode')">
                    <h5>🔍 Pseudocode</h5>
                    <small class="text-muted">C, Java, Python</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card category-card text-center p-3" data-category="domain" onclick="showCategory('domain')">
                    <h5>🌐 Domain</h5>
                    <small class="text-muted">Cloud, Web, Security</small>
                </div>
            </div>
        </div>

        <div class="question-box" id="questionDisplay">
            <h4 class="fw-bold mb-3" id="categoryTitle">🧮 Aptitude</h4>
            <div id="questionsList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const questions = {
            aptitude: [
                { q: 'What is 15% of 200?', options: ['25', '30', '35', '40'], correct: 1 },
                { q: 'If 3x + 7 = 22, what is x?', options: ['3', '5', '7', '9'], correct: 1 },
                { q: 'What comes next: 2, 6, 12, 20, ?', options: ['24', '28', '30', '32'], correct: 2 },
                { q: 'A train travels 300 km in 5 hours. Speed?', options: ['50 km/h', '55 km/h', '60 km/h', '65 km/h'], correct: 2 },
                { q: 'Shirt costs Rs.800 after 20% discount. Original?', options: ['Rs.960', 'Rs.1000', 'Rs.1040', 'Rs.1100'], correct: 1 }
            ],
            technical: [
                { q: 'Which data structure uses LIFO?', options: ['Queue', 'Stack', 'Array', 'Linked List'], correct: 1 },
                { q: 'Time complexity of binary search?', options: ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)'], correct: 1 },
                { q: 'SQL command to retrieve data?', options: ['INSERT', 'UPDATE', 'SELECT', 'DELETE'], correct: 2 },
                { q: 'OOP stands for?', options: ['Object Oriented Programming', 'Order of Operations', 'Object Output Process', 'None'], correct: 0 },
                { q: 'Protocol for secure browsing?', options: ['HTTP', 'FTP', 'HTTPS', 'SMTP'], correct: 2 }
            ],
            pseudocode: [
                { q: 'Output of print(5 // 2) in Python?', options: ['2.5', '2', '3', '2.0'], correct: 1 },
                { q: 'Which loop executes at least once?', options: ['for', 'while', 'do-while', 'None'], correct: 2 },
                { q: 'int x = 5; x++; Result?', options: ['4', '5', '6', 'Error'], correct: 2 },
                { q: 'Equality operator in Python?', options: ['=', '==', '===', '!='], correct: 1 },
                { q: 'First array index in C?', options: ['1', '0', '-1', 'Depends'], correct: 1 }
            ],
            domain: [
                { q: 'Cloud service by Amazon?', options: ['Azure', 'AWS', 'GCP', 'Heroku'], correct: 1 },
                { q: 'API stands for?', options: ['Application Programming Interface', 'Advanced Program Integration', 'Automated Process Interface', 'None'], correct: 0 },
                { q: 'Cybersecurity best practice?', options: ['Same password', 'Enable 2FA', 'Share credentials', 'Skip updates'], correct: 1 },
                { q: 'Agile framework using sprints?', options: ['Waterfall', 'Scrum', 'Kanban only', 'Six Sigma'], correct: 1 },
                { q: 'CI/CD stands for?', options: ['Continuous Integration/Deployment', 'Code Integration/Delivery', 'Continuous Improvement/Design', 'None'], correct: 0 }
            ]
        };

        function showCategory(category) {
            document.querySelectorAll('.category-card').forEach(card => {
                card.classList.remove('active');
            });
            document.querySelector('[data-category="' + category + '"]').classList.add('active');
            
            const titles = {
                aptitude: '🧮 Aptitude',
                technical: '💻 Technical CS',
                pseudocode: '🔍 Pseudocode',
                domain: '🌐 Domain'
            };
            
            document.getElementById('categoryTitle').textContent = titles[category];
            
            const list = document.getElementById('questionsList');
            list.innerHTML = questions[category].map((q, i) => {
                const optionsHtml = q.options.map((opt, j) => 
                    '<div class="option-item" onclick="checkAnswer(this, ' + j + ', ' + q.correct + ')">' +
                    String.fromCharCode(65 + j) + ') ' + opt + '</div>'
                ).join('');
                return '<div class="mb-4"><p class="fw-bold">Q' + (i+1) + '. ' + q.q + '</p>' + optionsHtml + '</div>';
            }).join('');
        }

        function checkAnswer(element, selected, correct) {
            element.parentElement.querySelectorAll('.option-item').forEach(opt => {
                opt.style.background = '';
                opt.style.borderColor = '#e0e0e0';
            });
            
            if (selected === correct) {
                element.style.borderColor = '#2e7d32';
                element.style.background = '#e8f5e9';
            } else {
                element.style.borderColor = '#c62828';
                element.style.background = '#ffebee';
            }
        }

        showCategory('aptitude');
    </script>
</body>
</html>
