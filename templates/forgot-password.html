{% extends "base.html" %}
{% block title %}Forgot Password - Charvak{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow">
                <h3 class="text-center mb-3">Forgot Password</h3>
                <p class="text-muted text-center">Enter your email to receive reset link</p>
                <form id="forgotForm">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="resetEmail" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill">Send Reset Link</button>
                </form>
                <div id="resetMsg" class="mt-3 text-center"></div>
                <p class="text-center mt-3">
                    <a href="/login">Back to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var email = document.getElementById('resetEmail').value;
    var msg = document.getElementById('resetMsg');
    msg.innerHTML = 'Sending...';
    
    var response = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email})
    });
    var result = await response.json();
    
    if (result.status === 'success') {
        msg.innerHTML = '<div class="alert alert-success">' + result.message + '</div>';
    } else {
        msg.innerHTML = '<div class="alert alert-danger">' + result.message + '</div>';
    }
});
</script>
{% endblock %}
