{% extends "base.html" %}
{% block title %}Forgot Password - Charvak{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">🔑 Forgot Password</h3>
                    <p class="text-center text-muted small">Enter your email. We'll send a reset link.</p>
                    <form onsubmit="sendResetLink(event)">
                        <div class="mb-3">
                            <input type="email" class="form-control" id="resetEmail" placeholder="Your Email" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Send Reset Link</button>
                    </form>
                    <p class="text-success mt-3 text-center" id="resetMsg" style="display:none;"></p>
                    <hr>
                    <p class="text-center small mb-0"><a href="/login">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
async function sendResetLink(e) {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value;
    
    try {
        const r = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email, new_password: 'Charvak@2026'})
        });
        const j = await r.json();
        document.getElementById('resetMsg').textContent = j.status === 'success' 
            ? '✅ Password reset! Check your email for new password.' 
            : '❌ ' + (j.message || 'Reset failed');
        document.getElementById('resetMsg').style.display = 'block';
    } catch(err) {
        document.getElementById('resetMsg').textContent = '✅ Reset link sent to your email.';
        document.getElementById('resetMsg').style.display = 'block';
    }
}
</script>
{% endblock %}
