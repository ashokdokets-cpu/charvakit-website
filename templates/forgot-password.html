{% extends "base.html" %}
{% block title %}Forgot Password - Charvak{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow">
                <h3 class="text-center mb-3">🔐 Forgot Password</h3>
                <p class="text-muted text-center">Enter your email to receive a reset link</p>
                <form id="forgotForm">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="resetEmail" placeholder="you@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill" id="submitBtn">Send Reset Link</button>
                </form>
                <div id="resetMsg" class="mt-3 text-center"></div>
                <p class="text-center mt-3">
                    <a href="/login">← Back to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var email = document.getElementById('resetEmail').value.trim();
    var msg = document.getElementById('resetMsg');
    var btn = document.getElementById('submitBtn');
    
    if (!email) {
        msg.innerHTML = '<div class="alert alert-danger">Please enter your email</div>';
        return;
    }
    
    btn.disabled = true;
    btn.textContent = 'Sending...';
    msg.innerHTML = '';
    
    try {
        var response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email})
        });
        
        if (response.status === 429) {
            msg.innerHTML = '<div class="alert alert-warning">Too many requests. Please wait a minute and try again.</div>';
        } else {
            var result = await response.json();
            if (result.status === 'success') {
                msg.innerHTML = '<div class="alert alert-success">✅ ' + result.message + '<br><small>Check your inbox (and spam folder)</small></div>';
            } else {
                msg.innerHTML = '<div class="alert alert-danger">' + result.message + '</div>';
            }
        }
    } catch (error) {
        msg.innerHTML = '<div class="alert alert-danger">Network error. Please try again.</div>';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
    }
});
</script>
{% endblock %}
