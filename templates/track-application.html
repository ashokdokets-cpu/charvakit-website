{% extends "base.html" %}
{% block title %}Track Application - Charvak Career Engine{% endblock %}
{% block content %}
<div class="page-hero bg-gradient-primary text-white py-5">
    <div class="container py-4"><h1 class="display-4 fw-bold">Track Application</h1><p class="lead">Applied on LinkedIn, Naukri, or directly? Add the URL. We'll track everything.</p></div>
</div>
<div class="container py-5"><div class="row"><div class="col-lg-7 mx-auto">
    <div class="card border-0 shadow-lg p-4"><div class="card-body">
        <h4 class="mb-3">Add Application to Track</h4>
        <form onsubmit="trackApplication(event)">
            <div class="mb-3"><label class="form-label">Job Title</label><input type="text" class="form-control" placeholder="e.g. Senior React Developer"></div>
            <div class="mb-3"><label class="form-label">Company Name</label><input type="text" class="form-control" placeholder="e.g. Google"></div>
            <div class="mb-3"><label class="form-label">Job URL (from LinkedIn, Naukri, etc.)</label><input type="url" class="form-control" placeholder="https://linkedin.com/jobs/..."></div>
            <div class="row g-2 mb-3">
                <div class="col-6"><label class="form-label">Applied Date</label><input type="date" class="form-control"></div>
                <div class="col-6"><label class="form-label">Status</label><select class="form-select"><option>Applied</option><option>Shortlisted</option><option>Interview Scheduled</option><option>Offer Received</option></select></div>
            </div>
            <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" rows="2" placeholder="Any follow-up notes..."></textarea></div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Start Tracking</button>
        </form>
    </div></div>
    <div class="text-center mt-3"><a href="/job-board" class="btn btn-outline-primary">Back to Job Board</a></div>
</div></div></div>
<script>
function trackApplication(e){
    e.preventDefault();
    const title = document.querySelector('input[placeholder*="Senior"]').value;
    const company = document.querySelector('input[placeholder*="Google"]').value;
    if(!title || !company) return alert('Please fill Job Title and Company Name!');
    
    const apps = JSON.parse(localStorage.getItem('tracked_applications')||'[]');
    apps.push({
        title, company,
        url: document.querySelector('input[type="url"]').value,
        date: document.querySelector('input[type="date"]').value,
        status: document.querySelector('select').value,
        notes: document.querySelector('textarea').value,
        added: new Date().toISOString()
    });
    localStorage.setItem('tracked_applications', JSON.stringify(apps));
    alert('Application tracked! View all in your Application Dashboard.');
    document.querySelector('form').reset();
}
</script>
{% endblock %}
