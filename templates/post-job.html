{% extends "base.html" %}
{% block title %}Post a Job - Charvak Career Engine{% endblock %}
{% block content %}
<div class="page-hero bg-gradient-primary text-white py-5">
    <div class="container py-4"><h1 class="display-4 fw-bold">Post a Job</h1><p class="lead">Reach 10,000+ vetted candidates. Pay only <span data-inr="999">999</span> per post.</p></div>
</div>
<div class="container py-5"><div class="row"><div class="col-lg-7 mx-auto">
    <div class="card border-0 shadow-lg p-4"><div class="card-body">
        <h4 class="mb-3">Job Details</h4>
        <form>
            <div class="row g-2 mb-3">
                <div class="col-md-8"><label class="form-label">Job Title</label><input type="text" class="form-control" placeholder="e.g. Senior Python Developer"></div>
                <div class="col-md-4"><label class="form-label">Type</label><select class="form-select"><option>Permanent</option><option>Contract</option><option>Contract-to-Hire</option><option>Freelance</option><option>Fractional</option><option>Internship</option><option>Part-Time</option><option>Gig / Project-Based</option></select></div>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-md-6"><label class="form-label">Company</label><input type="text" class="form-control" placeholder="Your company name"></div>
                <div class="col-md-6"><label class="form-label">Location</label><input type="text" class="form-control" placeholder="e.g. Remote, Bengaluru"></div>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-md-6"><label class="form-label">Salary Range</label><input type="text" class="form-control" placeholder="e.g. 15-25 LPA"></div>
                <div class="col-md-6"><label class="form-label">Experience</label><input type="text" class="form-control" placeholder="e.g. 3-5 years"></div>
            </div>
            <div class="mb-3"><label class="form-label">Skills Required</label><input type="text" class="form-control" placeholder="e.g. Python, FastAPI, PostgreSQL"></div>
            <div class="mb-3"><label class="form-label">Job Description</label><textarea class="form-control" rows="4" placeholder="Describe the role, responsibilities, and requirements..."></textarea></div>
            <div class="mb-3"><label class="form-label">Application Link/Email</label><input type="text" class="form-control" placeholder="Where should candidates apply?"></div>
            <div class="alert alert-info">Posting fee: <span data-inr="999">999</span>. Payment via Dokets VouchAI Escrow.</div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Post Job - <span data-inr="999">999</span></button>
        </form>
    </div></div>
    <div class="text-center mt-3"><a href="/job-board" class="btn btn-outline-primary">Back to Job Board</a></div>
</div></div></div>
{% endblock %}
