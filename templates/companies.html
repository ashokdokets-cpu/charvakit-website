{% extends "base.html" %}
{% block title %}Companies - Charvak IT Consulting{% endblock %}
{% block content %}
<div class="page-hero bg-gradient-primary text-white py-5">
    <div class="container py-4 text-center">
        <h1 class="display-4 fw-bold">🏢 Companies</h1>
        <p class="lead">Explore employer brands and reviews</p>
    </div>
</div>

<!-- CREATE BRAND PAGE FORM -->
<div class="container py-4">
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h5>Create Your Brand Page</h5>
            <form onsubmit="createBrand(event)">
                <div class="row g-3">
                    <div class="col-md-6"><input type="text" class="form-control" id="companyName" placeholder="Company Name" required></div>
                    <div class="col-md-6"><input type="text" class="form-control" id="industry" placeholder="Industry" required></div>
                    <div class="col-md-6"><input type="text" class="form-control" id="location" placeholder="Location"></div>
                    <div class="col-md-6"><input type="text" class="form-control" id="size" placeholder="Company Size"></div>
                    <div class="col-12"><textarea class="form-control" id="description" rows="2" placeholder="Brief description"></textarea></div>
                    <div class="col-12"><button class="btn btn-primary" type="submit">Create Brand Page</button></div>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container py-5">
    <div class="row" id="companyList">
        <p class="text-muted text-center">No companies yet. Be the first to create a brand page!</p>
    </div>
</div>
<script>
fetch('/api/brand/companies')
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success' && data.companies.length > 0) {
            document.getElementById('companyList').innerHTML = data.companies.map(c => `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body text-center">
                            <h5>${c.company_name}</h5>
                            <p class="text-muted small">${c.industry} • ${c.location}</p>
                            <div class="mb-2">
                                <span class="badge bg-success">⭐ ${c.average_rating || 'New'}</span>
                                <span class="badge bg-light text-dark">${c.review_count} reviews</span>
                            </div>
                            <button class="btn btn-outline-primary btn-sm" onclick="viewCompany('${c.brand_id}')">View Profile</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    });

function viewCompany(brandId) {
    window.location.href = '/companies/' + brandId;
}
</script>
<script>
async function createBrand(e) {
    e.preventDefault();
    const data = {
        company_name: document.getElementById('companyName').value,
        industry: document.getElementById('industry').value,
        location: document.getElementById('location').value,
        size: document.getElementById('size').value,
        description: document.getElementById('description').value
    };
    const resp = await fetch('/api/brand/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    const result = await resp.json();
    alert(result.message || 'Brand page created!');
    location.reload();
}
</script>
{% endblock %}
