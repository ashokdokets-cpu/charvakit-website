{% extends "base.html" %}
{% block title %}Funnel Analytics{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 style="margin: 0;">📊 Funnel Analytics</h2>
      <p style="color: #666; margin: 4px 0 0 0;">Track candidate journey from resume scan → job view → payment → assessment.</p>
    </div>
    <button onclick="loadStats()" class="btn btn-primary">🔄 Refresh</button>
  </div>

  <div class="row g-3 mb-4" id="stats24h">
    <div class="col-12 text-muted text-center py-3">Loading...</div>
  </div>

  <div class="card shadow-sm border-0 mt-4">
    <div class="card-header bg-white">
      <h5 class="mb-0">🕐 Recent Events (Last 20)</h5>
    </div>
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Time</th>
            <th>Event</th>
            <th>Email</th>
            <th>Job ID</th>
          </tr>
        </thead>
        <tbody id="recentTable">
          <tr><td colspan="4" class="text-center py-3 text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const FUNNEL_ICONS = {
  'resume_scan': '📄 Resume Scanned',
  'job_view': '👀 Job Viewed',
  'paywall_shown': '💳 Paywall Shown',
  'payment_success': '💰 Payment Success',
  'assessment_started': '🎯 Assessment Started'
};

async function loadStats() {
  const token = localStorage.getItem('authToken') || '';
  try {
    const res = await fetch('/api/admin/funnel/stats', {headers: {'Authorization': 'Bearer ' + token}});
    const data = await res.json();
    if (data.status !== 'success') throw new Error(data.message || 'Failed');

    const stats24h = document.getElementById('stats24h');
    const keys = ['resume_scan', 'job_view', 'paywall_shown', 'payment_success', 'assessment_started'];
    stats24h.innerHTML = keys.map(k => `
      <div class="col-md-2 col-6">
        <div class="card text-center shadow-sm border-0 h-100">
          <div class="card-body">
            <h3 class="mb-0 text-primary">${data.last_24h[k] || 0}</h3>
            <small class="text-muted">${FUNNEL_ICONS[k] || k}</small>
          </div>
        </div>
      </div>
    `).join('');

    const tbody = document.getElementById('recentTable');
    if (data.recent && data.recent.length) {
      tbody.innerHTML = data.recent.map(e => `
        <tr>
          <td class="small text-muted">${new Date(e.at).toLocaleString()}</td>
          <td><span class="badge bg-info">${FUNNEL_ICONS[e.type] || e.type}</span></td>
          <td class="small">${e.email || '—'}</td>
          <td class="small text-monospace">${e.job_id || '—'}</td>
        </tr>
      `).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-muted">No events yet.</td></tr>';
    }
  } catch(e) {
    console.error('Funnel stats error:', e);
  }
}

document.addEventListener('DOMContentLoaded', loadStats);
setInterval(loadStats, 30000);
</script>
{% endblock %}
