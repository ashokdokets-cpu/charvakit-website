<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Credits Pricing - Charvak IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f8f9fa;
        }
        .plan-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
        }
        .plan-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .popular-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 8px;
            font-weight: 600;
        }
        .plan-price {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1a1a2e;
        }
        .plan-credits {
            font-size: 2rem;
            font-weight: bold;
            color: #3ba591;
        }
        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .feature-list li {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            color: #666;
            font-size: 14px;
        }
        .feature-list li:last-child {
            border-bottom: none;
        }
        .feature-list i {
            color: #28a745;
            margin-right: 8px;
        }
        .btn-subscribe {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-subscribe:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .credit-balance-box {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
        }
        .credit-balance-box h3 {
            color: #3ba591;
            margin-bottom: 10px;
        }
        .credit-balance-box .balance {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#1a1a2e;">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img src="/static/images/logo.png" alt="Logo" height="32">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/pricing">Service Pricing</a></li>
                <li class="nav-item"><a class="nav-link" href="/credit-dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/ai-credits-pricing" style="color:#3ba591; font-weight:600;">AI Credits</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <!-- Header -->
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold" style="color:#1a1a2e;">AI Credit Plans</h1>
        <p class="lead text-muted">Power all AI tools with credits</p>
        <p class="text-muted">Assignment Assistant, Research Helper, FYP Tools, and more</p>
    </div>

    <!-- Currency Selector -->
    <div class="text-center mb-4">
        <label class="me-2 fw-semibold">Select Currency:</label>
        <select id="currencySelector" class="form-select d-inline-block w-auto" onchange="changeCurrency(this.value)">
            <option value="INR">₹ INR (India)</option>
            <option value="USD">$ USD (US)</option>
            <option value="EUR">€ EUR (Europe)</option>
            <option value="GBP">£ GBP (UK)</option>
            <option value="AED">د.إ AED (UAE)</option>
            <option value="SGD">S$ SGD (Singapore)</option>
            <option value="AUD">A$ AUD (Australia)</option>
            <option value="CAD">C$ CAD (Canada)</option>
        </select>
    </div>

    <!-- Current Balance -->
    <div class="credit-balance-box text-center mb-5 mx-auto" style="max-width: 500px;">
        <h3><i class="bi bi-lightning-charge me-2"></i>Your AI Credit Balance</h3>
        <div id="balance-loading" class="text-light">Loading...</div>
        <div id="balance-display" style="display:none;">
            <div class="balance" id="credits-remaining">0</div>
            <p class="mt-2 mb-0">Plan: <span id="current-plan" class="fw-bold">Free</span></p>
            <p class="mb-0">Expires: <span id="plan-expiry">-</span></p>
        </div>
    </div>

    <!-- Pricing Cards -->
    <div class="row g-4" id="plans-container">
        <div class="col-12 text-center text-muted">Loading plans...</div>
    </div>
</div>

<!-- Payment Modal -->
<div id="payment-modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Subscribe to Plan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="payment-details"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="processSubscription()">Confirm & Pay</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let userEmail = localStorage.getItem('userEmail') || 'demo@charvakit.com';
    let selectedPlan = null;
    let allPlans = {};
    let currentCurrency = localStorage.getItem('charvak_currency') || 'INR';

    // Currency conversion rates (to INR)
    const currencyRates = {
        INR: 1,
        USD: 83,
        EUR: 90,
        GBP: 105,
        AED: 22.6,
        SGD: 61,
        AUD: 54,
        CAD: 61
    };

    const currencySymbols = {
        INR: '₹',
        USD: '$',
        EUR: '€',
        GBP: '£',
        AED: 'د.إ',
        SGD: 'S$',
        AUD: 'A$',
        CAD: 'C$'
    };

    function convertPrice(inrPrice) {
        if (currentCurrency === 'INR') return inrPrice;
        const converted = inrPrice / currencyRates[currentCurrency];
        return Math.round(converted * 100) / 100;
    }

    function formatPrice(inrPrice) {
        const converted = convertPrice(inrPrice);
        const symbol = currencySymbols[currentCurrency] || '$';
        return symbol + converted.toLocaleString();
    }

    function changeCurrency(currency) {
        currentCurrency = currency;
        localStorage.setItem('charvak_currency', currency);
        loadPlans();
    }

    // Auto-detect user location
    async function detectUserLocation() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            const countryToCurrency = {
                'IN': 'INR', 'US': 'USD', 'GB': 'GBP', 'AE': 'AED',
                'SG': 'SGD', 'AU': 'AUD', 'CA': 'CAD',
                'DE': 'EUR', 'FR': 'EUR', 'IT': 'EUR', 'ES': 'EUR',
                'NL': 'EUR', 'BE': 'EUR', 'IE': 'EUR', 'PT': 'EUR'
            };
            const detected = countryToCurrency[data.country_code] || 'USD';
            if (!localStorage.getItem('charvak_currency')) {
                currentCurrency = detected;
                document.getElementById('currencySelector').value = detected;
            }
        } catch (error) {
            console.log('Location detection failed, using default');
        }
    }

    async function loadBalance() {
        try {
            const response = await fetch(`/api/credits/${userEmail}`);
            const data = await response.json();
            if (data.status === 'success') {
                document.getElementById('balance-loading').style.display = 'none';
                document.getElementById('balance-display').style.display = 'block';
                document.getElementById('credits-remaining').textContent = data.credits_remaining;
                document.getElementById('current-plan').textContent = data.plan;
                document.getElementById('plan-expiry').textContent = new Date(data.expires_at).toLocaleDateString();
            }
        } catch (error) {
            console.error('Error loading balance:', error);
        }
    }

    async function loadPlans() {
        try {
            const response = await fetch('/api/credits/plans');
            const data = await response.json();
            if (data.status === 'success') {
                allPlans = data.plans;
                displayPlans(data.plans);
            }
        } catch (error) {
            console.error('Error loading plans:', error);
        }
    }

    function displayPlans(plans) {
        const container = document.getElementById('plans-container');
        container.innerHTML = '';
        
        const planOrder = ['free', 'starter', 'pro', 'premium', 'enterprise'];
        
        planOrder.forEach(planKey => {
            const plan = plans[planKey];
            if (!plan) return;
            
            const isPopular = planKey === 'pro';
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4 col-xl';
            
            col.innerHTML = `
                <div class="plan-card h-100 ${isPopular ? 'border border-success' : ''}">
                    ${isPopular ? '<div class="popular-badge">MOST POPULAR</div>' : ''}
                    <div class="p-4">
                        <h3 class="fw-bold mb-3">${plan.name}</h3>
                        <div class="plan-price mb-2">${formatPrice(plan.price)}</div>
                        ${plan.price > 0 ? '<div class="text-muted mb-3">per plan</div>' : '<div class="text-muted mb-3">Free forever</div>'}
                        <div class="plan-credits mb-3">${plan.credits.toLocaleString()}</div>
                        <div class="text-muted mb-4">credits</div>
                        <ul class="feature-list mb-4">
                            ${plan.features.map(feature => `
                                <li><i class="bi bi-check-circle-fill"></i>${feature}</li>
                            `).join('')}
                            ${plan.daily_bonus > 0 ? `
                                <li><i class="bi bi-check-circle-fill"></i>${plan.daily_bonus} daily bonus credits</li>
                            ` : ''}
                            <li><i class="bi bi-check-circle-fill"></i>${plan.validity_days} days validity</li>
                        </ul>
                        <button onclick="selectPlan('${planKey}')" class="btn btn-subscribe ${plan.price === 0 ? 'btn-outline-secondary' : 'btn-success'}">
                            ${plan.price === 0 ? 'Start Free' : 'Subscribe Now'}
                        </button>
                    </div>
                </div>
            `;
            
            container.appendChild(col);
        });
    }

    function selectPlan(planKey) {
        selectedPlan = planKey;
        const plan = allPlans[planKey];
        
        if (plan.price === 0) {
            activateFreePlan();
            return;
        }
        
        document.getElementById('payment-details').innerHTML = `
            <div class="p-3 bg-light rounded">
                <p class="mb-2">Plan: <strong>${plan.name}</strong></p>
                <p class="mb-2">Credits: <strong>${plan.credits.toLocaleString()}</strong></p>
                <p class="mb-2">Validity: <strong>${plan.validity_days} days</strong></p>
                ${plan.daily_bonus > 0 ? `<p class="mb-2">Daily Bonus: <strong>${plan.daily_bonus} credits</strong></p>` : ''}
                <p class="h4 text-success mt-3">${formatPrice(plan.price)}</p>
            </div>
        `;
        
        const modal = new bootstrap.Modal(document.getElementById('payment-modal'));
        modal.show();
    }

    async function processSubscription() {
        try {
            const response = await fetch('/api/credits/purchase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, plan: selectedPlan })
            });
            
            const data = await response.json();
            if (data.status === 'success') {
                alert(`✅ ${data.message}`);
                bootstrap.Modal.getInstance(document.getElementById('payment-modal')).hide();
                loadBalance();
            } else {
                alert('❌ ' + data.message);
            }
        } catch (error) {
            console.error('Subscription error:', error);
            alert('Payment failed. Please try again.');
        }
    }

    async function activateFreePlan() {
        try {
            const response = await fetch('/api/credits/purchase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, plan: 'free' })
            });
            const data = await response.json();
            alert(data.message || 'Free plan activated!');
            loadBalance();
        } catch (error) {
            console.error('Error:', error);
        }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
        await detectUserLocation();
        loadBalance();
        loadPlans();
        
        // Set currency selector
        if (currentCurrency) {
            document.getElementById('currencySelector').value = currentCurrency;
        }
    });
</script>
</body>
</html>
