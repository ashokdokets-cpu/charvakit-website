{% extends "base.html" %}
{% block title %}Hire Vetted Talent - Charvak{% endblock %}
{% block content %}
<div class="page-hero bg-gradient-primary text-white py-5">
    <div class="container py-4"><h1 class="display-4 fw-bold">Hire Vetted Talent</h1><p class="lead">Pre-screened developers with AI-verified portfolios. 48-hour placement.</p></div>
</div>
<div class="container py-5"><div class="row"><div class="col-lg-7 mx-auto">
    <div class="card border-0 shadow-lg p-4"><div class="card-body">
        <h3 class="mb-4">Tell Us Your Requirements</h3>
        <form>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Company Name</label><input type="text" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Contact Email</label><input type="email" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Role Needed</label><input type="text" class="form-control" placeholder="e.g. React Developer"></div>
                <div class="col-md-6"><label class="form-label">Number of Developers</label><select class="form-select"><option>1</option><option>2-3</option><option>4-5</option><option>5+</option></select></div>
                <div class="col-md-6"><label class="form-label">Engagement Type</label><select class="form-select"><option>Full-time</option><option>Contract</option><option>Contract-to-Hire</option></select></div>
                <div class="col-md-6"><label class="form-label">Budget Range (₹)</label><select class="form-select"><option><span data-inr="3">₹3</span>-5 LPA</option><option><span data-inr="5">₹5</span>-10 LPA</option><option><span data-inr="10">₹10</span>-20 LPA</option><option><span data-inr="20">₹20</span>+ LPA</option></select></div>
                <div class="col-12"><label class="form-label">Job Description</label><textarea class="form-control" rows="3"></textarea></div>
                <div class="col-12"><button type="submit" class="btn btn-primary btn-lg w-100">Get Candidates in 48 Hours</button></div>
            </div>
        </form>
    </div></div>
</div></div></div>
{% endblock %}
