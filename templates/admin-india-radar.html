{% extends "base.html" %}
{% block title %}India Requirement Radar{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 style="margin: 0;">🇮🇳 India Requirement Radar</h2>
      <p style="color: #666; margin: 4px 0 0 0;">Legal NCS feeds matched to your verified candidates.</p>
    </div>
    <button onclick="runRadar()" class="btn btn-primary" id="btnRun">🔄 Run Radar Scan</button>
  </div>

  <div class="card shadow-sm border-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Job Details</th>
            <th>Matched Candidate</th>
            <th>Overlap</th>
            <th>Alert Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="radarTable">
          <tr><td colspan="5" class="text-center p-4 text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
async function loadRadar() {
  const token = localStorage.getItem('authToken') || '';
  const res = await fetch('/api/admin/india-radar/alerts', { headers: { 'Authorization': 'Bearer ' + token } });
  const data = await res.json();
  const tbody = document.getElementById('radarTable');
  
  if (data.status === 'success' && data.alerts.length > 0) {
    tbody.innerHTML = data.alerts.map(a => `
      <tr>
        <td>
          <div class="fw-bold">${a.job_title}</div>
          <div class="small text-muted">${a.company} • ${a.location} • ${a.salary || 'Salary N/A'}</div>
        </td>
        <td>
          <div class="fw-bold">${a.matched_candidate}</div>
          <div class="small text-muted">${a.candidate_email}</div>
        </td>
        <td><span class="badge bg-success">${a.overlap_pct}%</span></td>
        <td><span class="badge bg-${a.status === 'alerted' ? 'primary' : 'warning'}">${a.status}</span></td>
        <td>
          ${a.status === 'pending_alert' 
            ? `<button onclick="pushAlert(${a.alert_id})" class="btn btn-sm btn-primary">✉ Send Alert</button>`
            : `<span class="text-success"><i class="bi bi-check-circle"></i> Sent</span>`}
        </td>
      </tr>
    `).join('');
  } else {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-muted">No alerts yet. Click "Run Radar Scan".</td></tr>';
  }
}

async function runRadar() {
  const btn = document.getElementById('btnRun');
  btn.disabled = true; btn.textContent = 'Scanning...';
  const token = localStorage.getItem('authToken') || '';
  try {
    const res = await fetch('/api/admin/india-radar/run', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
    const data = await res.json();
    alert(`Radar scan complete! Matched ${data.matched || 0} jobs.`);
    loadRadar();
  } catch(e) { alert('Error: ' + e); }
  btn.disabled = false; btn.textContent = '🔄 Run Radar Scan';
}

async function pushAlert(id) {
  const token = localStorage.getItem('authToken') || '';
  try {
    await fetch(`/api/admin/india-radar/push/${id}`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
    alert('Alert email sent to candidate!');
    loadRadar();
  } catch(e) { alert('Error sending email.'); }
}

document.addEventListener('DOMContentLoaded', loadRadar);
</script>
{% endblock %}
