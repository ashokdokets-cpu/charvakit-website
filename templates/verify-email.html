{% extends "base.html" %}
{% block title %}Verify Email - Charvak{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 text-center">
                {% if success %}
                <div style="font-size:60px;">✅</div>
                <h2 class="text-success">Email Verified!</h2>
                <p>{{ message }}</p>
                <a href="/login" class="btn btn-primary rounded-pill px-4">Go to Login</a>
                {% else %}
                <div style="font-size:60px;">❌</div>
                <h2 class="text-danger">Verification Failed</h2>
                <p>{{ message }}</p>
                <a href="/register" class="btn btn-primary rounded-pill px-4">Register Again</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
