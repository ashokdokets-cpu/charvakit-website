{% extends "base.html" %}
{% block title %}Join Developer Pool - Charvak{% endblock %}
{% block content %}
<div class="page-hero bg-gradient-primary text-white py-5">
    <div class="container py-4"><h1 class="display-4 fw-bold">Join Developer Pool</h1><p class="lead">Build real projects. Get AI-verified. Get hired.</p></div>
</div>
<div class="container py-5"><div class="row"><div class="col-lg-7 mx-auto">
    <div class="card border-0 shadow-lg p-4"><div class="card-body">
        <h3 class="mb-4">Developer Registration</h3>
        <form>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Phone</label><input type="tel" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Primary Skill</label><select class="form-select"><option>Python</option><option>JavaScript</option><option>React</option><option>Java</option><option>PHP</option><option>Other</option></select></div>
                <div class="col-md-6"><label class="form-label">Experience Level</label><select class="form-select"><option>Fresher</option><option>1-2 years</option><option>2-5 years</option><option>5+ years</option></select></div>
                <div class="col-md-6"><label class="form-label">GitHub Profile URL</label><input type="url" class="form-control" placeholder="https://github.com/yourusername"></div>
                <div class="col-12"><label class="form-label">Why do you want to join?</label><textarea class="form-control" rows="3"></textarea></div>
                <div class="col-12"><button type="submit" class="btn btn-primary btn-lg w-100">Submit Application</button></div>
            </div>
        </form>
    </div></div>
</div></div></div>
{% endblock %}
