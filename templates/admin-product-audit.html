{% extends "base.html" %}

{% block title %}Product Audit Trail{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Product Audit Trail</h1>
        <small class="text-muted">#86 - view recent AI product calls</small>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small">Product type</label>
                    <select class="form-select form-select-sm" id="fType">
                        <option value="">All</option>
                        <option value="lock_in_breaker">Lock-In Breaker</option>
                        <option value="reverse_staffing">Reverse Staffing</option>
                        <option value="auditbot">AuditBot</option>
                        <option value="skill_twin">Skill Twin</option>
                        <option value="micro_squads">Micro Squads</option>
                        <option value="agency_twin">Agency Twin</option>
                        <option value="geo_compliance">Geo Compliance</option>
                        <option value="design_token">Design Token</option>
                        <option value="silent_killer">Silent Killer</option>
                        <option value="ai_slop">AI Slop</option>
                        <option value="developer_entropy">Developer Entropy</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Email (optional)</label>
                    <input class="form-control form-control-sm" id="fEmail" placeholder="user@example.com">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Days</label>
                    <input class="form-control form-control-sm" type="number" id="fDays" value="30" min="1" max="365">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Limit</label>
                    <input class="form-control form-control-sm" type="number" id="fLimit" value="100" min="1" max="500">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary btn-sm w-100" onclick="loadResults()">Load</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Results <span id="count" class="text-muted">(0)</span></h2>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadResults()">Refresh</button>
            </div>
            <div class="table-responsive">
                <table class="table table-sm table-hover">
                    <thead>
                        <tr>
                            <th>Result ID</th>
                            <th>Type</th>
                            <th>Email</th>
                            <th>Created</th>
                            <th>Input</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <tr><td colspan="6" class="text-center text-muted py-4">Click "Load" to fetch results.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
async function loadResults() {
    const t = document.getElementById('fType').value;
    const e = document.getElementById('fEmail').value;
    const d = document.getElementById('fDays').value;
    const l = document.getElementById('fLimit').value;

    const params = new URLSearchParams();
    if (t) params.set('product_type', t);
    if (e) params.set('email', e);
    params.set('days', d);
    params.set('limit', l);

    document.getElementById('resultsBody').innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>';

    try {
        const r = await fetch('/api/products/results?' + params.toString());
        const data = await r.json();

        if (data.status !== 'success') {
            document.getElementById('resultsBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Error: ' + (data.message || 'unknown') + '</td></tr>';
            return;
        }

        document.getElementById('count').textContent = '(' + data.count + ')';

        if (data.count === 0) {
            document.getElementById('resultsBody').innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No results in this window.</td></tr>';
            return;
        }

        document.getElementById('resultsBody').innerHTML = data.results.map(r => {
            const inStr = JSON.stringify(r.input_data).substring(0, 100);
            const resStr = JSON.stringify(r.result_data).substring(0, 100);
            return `
                <tr>
                    <td><code>${r.result_id}</code></td>
                    <td><span class="badge bg-secondary">${r.product_type}</span></td>
                    <td>${r.email || '<em class="text-muted">-</em>'}</td>
                    <td><small>${r.created_at}</small></td>
                    <td><small title='${JSON.stringify(r.input_data)}'>${inStr}...</small></td>
                    <td><small title='${JSON.stringify(r.result_data)}'>${resStr}...</small></td>
                </tr>`;
        }).join('');
    } catch (e) {
        document.getElementById('resultsBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Network error: ' + e.message + '</td></tr>';
    }
}
</script>
{% endblock %}
