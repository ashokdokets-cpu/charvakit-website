{% extends "base.html" %}
{% block title %}Screen Call — {{ session_info.role_title }}{% endblock %}

{% block content %}
<style>
.sc-wrap { max-width: 720px; margin: 32px auto; padding: 0 20px; }
.sc-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); overflow: hidden; }
.sc-header { background: linear-gradient(135deg, #3ba591 0%, #2a8070 100%); color: #fff; padding: 28px 32px; }
.sc-header h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 4px; }
.sc-header p { margin: 0; opacity: 0.9; font-size: 0.95rem; }
.sc-body { padding: 32px; }
.sc-consent { background: #f0fdf4; border: 1px solid #86efac; border-radius: 10px; padding: 20px; margin-bottom: 20px; font-size: 0.9rem; line-height: 1.6; color: #166534; }
.sc-consent strong { display: block; margin-bottom: 8px; }
.sc-start-btn { background: #3ba591; color: white; padding: 14px 28px; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; }
.sc-start-btn:hover { background: #2a8070; }
.sc-messages { max-height: 420px; overflow-y: auto; padding: 16px; background: #f8fafc; border-radius: 10px; margin-bottom: 16px; display: none; }
.sc-msg { margin-bottom: 14px; max-width: 82%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
.sc-msg-ai { background: #eff6ff; color: #1e40af; border-bottom-left-radius: 4px; }
.sc-msg-user { background: #dcfce7; color: #166534; margin-left: auto; border-bottom-right-radius: 4px; }
.sc-msg-system { background: #fef3c7; color: #92400e; font-size: 0.85rem; text-align: center; max-width: 100%; margin: 16px auto; padding: 10px 16px; border-radius: 8px; }
.sc-typing { display: none; padding: 10px 16px; background: #eff6ff; border-radius: 14px; max-width: 60px; margin-bottom: 14px; }
.sc-typing span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3ba591; margin: 0 2px; animation: sc-bounce 1.4s infinite both; }
.sc-typing span:nth-child(2) { animation-delay: 0.2s; }
.sc-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes sc-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
.sc-input-row { display: flex; gap: 10px; }
.sc-input { flex: 1; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
.sc-input:focus { outline: none; border-color: #3ba591; box-shadow: 0 0 0 3px rgba(59,165,145,0.1); }
.sc-send-btn { background: #3ba591; color: #fff; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; }
.sc-send-btn:hover { background: #2a8070; }
.sc-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.sc-done { display: none; margin-top: 20px; }
.sc-done h2 { font-size: 1.4rem; color: #166534; margin-bottom: 8px; }
.sc-done p { color: #4b5563; margin-bottom: 16px; }
.sc-slot-btn { display: block; width: 100%; padding: 14px; margin-bottom: 10px; border: 2px solid #3ba591; background: #fff; color: #3ba591; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.15s; }
.sc-slot-btn:hover { background: #3ba591; color: #fff; }
.sc-disqualified { background: #f0fdf4; border: 1px solid #86efac; border-radius: 10px; padding: 24px; color: #166534; }
.sc-disqualified h2 { margin: 0 0 12px; font-size: 1.3rem; }
.sc-disqualified p { margin: 0; line-height: 1.6; }
</style>

<div class="sc-wrap">
  <div class="sc-card">
    <div class="sc-header">
      <h1>Quick screen for {{ session_info.role_title }}</h1>
      <p>{{ session_info.company_name }}</p>
    </div>

    <div class="sc-body">
      <div id="consentBox" class="sc-consent">
        <strong>Before we begin</strong>
        {{ session_info.consent_text }}
      </div>
      <button id="startBtn" class="sc-start-btn">I consent, start the screen</button>

      <div id="chatArea">
        <div id="messages" class="sc-messages"></div>
        <div id="typing" class="sc-typing"><span></span><span></span><span></span></div>
        <div id="inputRow" class="sc-input-row">
          <input id="answerInput" type="text" class="sc-input" placeholder="Type your answer..." autocomplete="off">
          <button id="sendBtn" class="sc-send-btn">Send</button>
        </div>
      </div>

      <div id="doneArea" class="sc-done"></div>
    </div>
  </div>
</div>

<script>
var TOKEN = {{ token|tojson }};
var isSending = false;

function appendMessage(role, text) {
  var m = document.getElementById('messages');
  var div = document.createElement('div');
  div.className = 'sc-msg sc-msg-' + role;
  div.textContent = text;
  m.appendChild(div);
  m.scrollTop = m.scrollHeight;
}

function showTyping() {
  document.getElementById('typing').style.display = 'block';
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function hideTyping() {
  document.getElementById('typing').style.display = 'none';
}

async function startChat() {
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('consentBox').style.display = 'none';
  document.getElementById('chatArea').style.display = 'block';
  document.getElementById('messages').style.display = 'block';
  showTyping();
  try {
    var r = await fetch('/api/screen/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: TOKEN})
    });
    var d = await r.json();
    hideTyping();
    if (d.status === 'success' && d.question) {
      appendMessage('ai', d.question);
    } else if (d.status === 'error') {
      appendMessage('system', 'Error: ' + (d.message || 'unknown'));
    }
  } catch (e) {
    hideTyping();
    alert('Error starting: ' + e.message);
  }
}

async function sendAnswer() {
  if (isSending) return;
  var input = document.getElementById('answerInput');
  var answer = input.value.trim();
  if (!answer) return;
  isSending = true;
  appendMessage('user', answer);
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('inputRow').style.display = 'none';
  showTyping();

  try {
    var r = await fetch('/api/screen/answer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: TOKEN, answer: answer})
    });
    var d = await r.json();
    hideTyping();

    if (d.done) {
      document.getElementById('chatArea').style.display = 'none';
      var done = document.getElementById('doneArea');
      done.style.display = 'block';
      if (d.disqualified) {
        done.innerHTML = '<div class="sc-disqualified"><h2>Thank you for your time</h2><p>' + (d.reason || d.message || '') + '</p></div>';
      } else if (d.proposed_slots && d.proposed_slots.length) {
        var html = '<h2>Great! Let\'s schedule a call.</h2><p>Pick a slot that works for you:</p>';
        d.proposed_slots.forEach(function(slot, i) {
          html += '<button class="sc-slot-btn" onclick="pickSlot(' + i + ')">' + slot.display + '</button>';
        });
        done.innerHTML = html;
        window.__slots = d.proposed_slots;
      } else {
        done.innerHTML = '<h2>Thank you!</h2><p>The recruiter will be in touch shortly.</p>';
      }
    } else if (d.next_field) {
      appendMessage('ai', d.question);
      document.getElementById('inputRow').style.display = 'flex';
      input.focus();
    }
  } catch (e) {
    hideTyping();
    alert('Error: ' + e.message);
    document.getElementById('inputRow').style.display = 'flex';
  }
  document.getElementById('sendBtn').disabled = false;
  isSending = false;
}

function pickSlot(idx) {
  var slot = window.__slots[idx];
  var done = document.getElementById('doneArea');
  done.innerHTML = '<div class="sc-disqualified"><h2>Slot confirmed</h2><p>You selected: <strong>' + slot.display + '</strong>. The recruiter will send a calendar invite shortly.</p></div>';
}

document.getElementById('startBtn').addEventListener('click', startChat);
document.getElementById('sendBtn').addEventListener('click', sendAnswer);
document.getElementById('answerInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); sendAnswer(); }
});
</script>
{% endblock %}
