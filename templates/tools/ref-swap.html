{% extends "base.html" %}
{% block title %}Reference Check Swap - Charvak AI Tools{% endblock %}
{% block content %}
<div class="page-hero bg-gradient-primary text-white py-5">
    <div class="container py-4">
        <span class="badge bg-primary text-white mb-2 px-3 py-2">10 credits per run</span>
        <h1 class="display-4 fw-bold">Reference Check Swap</h1>
        <p class="lead">Swap references with peers. You verify them, they verify you.</p>
    </div>
</div>

<div class="container py-5"><div class="row"><div class="col-lg-7 mx-auto">
    <div class="card border-0 shadow-lg p-4 mb-4"><div class="card-body">
        <h4>Find a Swap Partner</h4>
        <div class="mb-3">
            <label class="form-label">Reference Type</label>
            <select class="form-select" id="refType">
                <option value="Professional">Professional</option>
                <option value="Academic">Academic</option>
                <option value="Personal">Personal</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Your Industry</label>
            <input type="text" class="form-control" id="industry" maxlength="100" placeholder="e.g., Software, Finance, Design">
        </div>
        <button class="btn btn-primary btn-lg w-100 mt-3" id="runBtn" onclick="runTool()">
            Run (10 credits)
        </button>
        <div id="toolError" class="alert alert-danger mt-3 d-none"></div>
    </div></div>

    <div class="card border-0 shadow-lg p-4 d-none" id="resultCard" style="border-left:5px solid #0ea5e9;">
        <div class="card-body" id="resultBody"></div>
    </div>
</div></div></div>

<script>
const TOOL_NAME = 'Reference Check Swap';
const TOOL_COST = 10;
const TOOL_ENDPOINT = '/api/tools/ref-swap';

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderValue(v, depth) {
    depth = depth || 0;
    if (v === null || v === undefined) return '<span class="text-muted">-</span>';
    if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') return esc(v);
    if (Array.isArray(v))
        return '<ul class="mb-0">' + v.map(x => '<li>' + renderValue(x, depth+1) + '</li>').join('') + '</ul>';
    if (typeof v === 'object') {
        return '<ul class="mb-0">' + Object.keys(v).map(k =>
            '<li><strong>' + esc(k) + ':</strong> ' + renderValue(v[k], depth+1) + '</li>'
        ).join('') + '</ul>';
    }
    return esc(v);
}

function renderResult(data) {
    const body = document.getElementById('resultBody');
    let html = '<h3>' + esc(TOOL_NAME) + ' Result</h3>';
    if (data.message) html += '<p class="text-muted">' + esc(data.message) + '</p>';
    for (const key of Object.keys(data)) {
        if (key === 'status' || key === 'message' || key === '_http_status') continue;
        html += '<div class="mb-3"><strong>' + esc(key.replace(/_/g, ' ')) + ':</strong> '
              + '<div>' + renderValue(data[key]) + '</div></div>';
    }
    body.innerHTML = html;
}

async function runTool() {
    const btn = document.getElementById('runBtn');
    const errEl = document.getElementById('toolError');
    errEl.classList.add('d-none');

    const authToken = localStorage.getItem('auth_token') || localStorage.getItem('charvak_token') || '';
    const email = localStorage.getItem('userEmail') || '';
    if (!authToken || !email) {
        alert('Please log in to use this tool.');
        window.location.href = '/login?next=' + window.location.pathname;
        return;
    }

    // ---- INPUT COLLECTION ----
    const refType = document.getElementById('refType').value;
    const industry = document.getElementById('industry').value.trim();
    const payload = { email: email, ref_type: refType, industry: industry };

    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Running...';

    try {
        const r = await fetch(TOOL_ENDPOINT, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + authToken
            },
            body: JSON.stringify(payload)
        });
        const j = await r.json();

        if (!r.ok) {
            btn.disabled = false;
            btn.textContent = originalText;
            if (r.status === 401) { alert(j.message || 'Please log in again.'); window.location.href = '/login?next=' + window.location.pathname; return; }
            if (r.status === 402) { alert(j.message || 'Insufficient credits.'); window.location.href = '/ai-credits-pricing'; return; }
            errEl.textContent = j.message || 'Request failed.';
            errEl.classList.remove('d-none');
            return;
        }

        renderResult(j);
        document.getElementById('resultCard').classList.remove('d-none');
        document.getElementById('resultCard').scrollIntoView({behavior:'smooth'});
        btn.disabled = false;
        btn.textContent = originalText;
    } catch (e) {
        console.error('tool failed', e);
        errEl.textContent = 'Network error - please try again.';
        errEl.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = originalText;
    }
}

</script>
{% endblock %}
