<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Content - Charvak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 50px 0; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="hero text-center">
        <h1>📝 Request Content</h1>
        <p class="lead">Need specific company content? Let us know!</p>
    </div>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="card p-4">
                    <h4 class="fw-bold mb-3">Content Request Form</h4>
                    <form id="contentRequestForm">
                        <div class="mb-3">
                            <label class="form-label">Your Email *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Company Name *</label>
                            <input type="text" class="form-control" id="companyName" placeholder="e.g. Google, Amazon, Microsoft" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Content Type *</label>
                            <select class="form-select" id="contentType" required>
                                <option value="">Select Type</option>
                                <option value="aptitude">Aptitude Questions</option>
                                <option value="technical">Technical Questions</option>
                                <option value="coding">Coding Problems</option>
                                <option value="mock_drive">Full Mock Drive</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Topic *</label>
                            <input type="text" class="form-control" id="topic" placeholder="e.g. Data Structures, System Design" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="3" placeholder="Describe what content you need"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill">Submit Request</button>
                    </form>
                    <div id="requestMsg" class="mt-3 text-center"></div>
                </div>

                <div class="card p-4 mt-3">
                    <h5 class="fw-bold">📧 Contact Admin</h5>
                    <p class="text-muted">Have questions? Message our team directly.</p>
                    <a href="mailto:hr@charvakit.com" class="btn btn-outline-primary w-100 rounded-pill">Email Admin</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('contentRequestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const response = await fetch('/api/company/content-request', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    company_name: document.getElementById('companyName').value,
                    content_type: document.getElementById('contentType').value,
                    topic: document.getElementById('topic').value,
                    description: document.getElementById('description').value
                })
            });
            const result = await response.json();
            document.getElementById('requestMsg').innerHTML = 
                '<div class="alert alert-success">✅ ' + result.message + '</div>';
            this.reset();
        });
    </script>
</body>
</html>
