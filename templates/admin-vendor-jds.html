{% extends "base.html" %}
{% block title %}Vendor JD Inbox{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Vendor JD Inbox</h1>
            <p class="text-muted mb-0">Every vendor JD, searchable and filterable</p>
        </div>
        <div>
            <span id="jdCount" class="badge bg-primary" style="font-size: 1rem;"></span>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small">Search</label>
                    <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Role, vendor, client...">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Work Auth</label>
                    <select id="workAuthSelect" class="form-select form-select-sm">
                        <option value="">Any</option>
                        <option value="H1B">H1B</option>
                        <option value="OPT">OPT</option>
                        <option value="GC">GC</option>
                        <option value="USC">USC</option>
                        <option value="USC/GC only">USC/GC only</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Skills</label>
                    <input type="text" id="skillsInput" class="form-control form-control-sm" placeholder="K8s, AWS...">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Min Rate ($/hr)</label>
                    <input type="number" id="rateMinInput" class="form-control form-control-sm" placeholder="60">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Max Rate ($/hr)</label>
                    <input type="number" id="rateMaxInput" class="form-control form-control-sm" placeholder="100">
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button class="btn btn-primary btn-sm w-100" onclick="loadJDs()">Filter</button>
                </div>
            </div>
        </div>
    </div>

    <div id="jdResults"></div>
</div>

<script>
function getToken() {
    return localStorage.getItem('authToken') || localStorage.getItem('auth_token') || localStorage.getItem('charvak_token') || '';
}

async function loadJDs() {
    const search = document.getElementById('searchInput').value;
    const workAuth = document.getElementById('workAuthSelect').value;
    const skills = document.getElementById('skillsInput').value;
    const rateMin = document.getElementById('rateMinInput').value;
    const rateMax = document.getElementById('rateMaxInput').value;

    const params = new URLSearchParams({status: 'active'});
    if (search) params.append('search', search);
    if (workAuth) params.append('work_auth', workAuth);
    if (skills) params.append('skills', skills);
    if (rateMin) params.append('rate_min', rateMin);
    if (rateMax) params.append('rate_max', rateMax);

    try {
        const r = await fetch(`/api/vendor-jds?${params}`, {
            headers: {'Authorization': `Bearer ${getToken()}`},
            credentials: 'include'
        });
        const data = await r.json();

        if (data.status !== 'success') {
            document.getElementById('jdResults').innerHTML =
                `<div class="alert alert-danger">${data.message || 'Error loading JDs'}</div>`;
            return;
        }

        document.getElementById('jdCount').textContent = `${data.total} JDs`;
        renderJDs(data.jds);
    } catch (e) {
        document.getElementById('jdResults').innerHTML =
            `<div class="alert alert-danger">Error: ${e.message}</div>`;
    }
}

function esc(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderJDs(jds) {
    if (!jds || jds.length === 0) {
        document.getElementById('jdResults').innerHTML =
            '<div class="alert alert-info">No JDs match your filters.</div>';
        return;
    }

    const cards = jds.map(jd => {
        const skills = Array.isArray(jd.skills_required) ? jd.skills_required : [];
        const rate = (jd.rate_min && jd.rate_max)
            ? `$${jd.rate_min}-$${jd.rate_max}/hr`
            : (jd.rate_min ? `$${jd.rate_min}/hr` : 'Rate not specified');

        return `
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="mb-1">${esc(jd.role_title)}</h5>
                            <div class="text-muted small mb-2">
                                ${esc(jd.vendor_name || 'Vendor')}
                                ${jd.client_name ? ' · ' + esc(jd.client_name) : ''}
                                ${jd.location ? ' · ' + esc(jd.location) : ''}
                            </div>
                        </div>
                        <span class="badge bg-success">${esc(rate)}</span>
                    </div>
                    <div class="mb-2">
                        ${skills.slice(0, 8).map(s => `<span class="badge bg-secondary me-1">${esc(s)}</span>`).join('')}
                    </div>
                    <div class="d-flex gap-3 small text-muted">
                        ${jd.work_auth_required ? `<span><strong>Auth:</strong> ${esc(jd.work_auth_required)}</span>` : ''}
                        ${jd.duration ? `<span><strong>Duration:</strong> ${esc(jd.duration)}</span>` : ''}
                        <span><strong>Posted:</strong> ${esc(jd.parsed_at ? jd.parsed_at.split('T')[0] : '—')}</span>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-sm btn-outline-danger" onclick="archiveJD('${esc(jd.jd_id)}')">Archive</button>
                    </div>
                </div>
            </div>
        `;
    }).join('');

    document.getElementById('jdResults').innerHTML = cards;
}

async function archiveJD(jdId) {
    if (!confirm('Archive this JD?')) return;
    try {
        const r = await fetch(`/api/vendor-jds/${jdId}/archive`, {
            method: 'POST',
            headers: {'Authorization': `Bearer ${getToken()}`},
            credentials: 'include'
        });
        const data = await r.json();
        if (data.status === 'success') {
            loadJDs();
        } else {
            alert('Archive failed: ' + (data.message || 'unknown error'));
        }
    } catch (e) {
        alert('Error: ' + e.message);
    }
}

document.addEventListener('DOMContentLoaded', loadJDs);
</script>
{% endblock %}
