{% extends "base.html" %}
{% block title %}Reset Password - Charvak{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow">
                <h3 class="text-center mb-3">🔐 Reset Password</h3>
                <p class="text-muted text-center">Enter your new password below</p>
                <form id="resetForm">
                    <input type="hidden" id="resetToken" value="{{ token }}">
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control" id="newPassword" required minlength="8" placeholder="Minimum 8 characters">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" required minlength="8" placeholder="Re-enter password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill">Reset Password</button>
                </form>
                <div id="resetMsg" class="mt-3 text-center"></div>
                <p class="text-center mt-3">
                    <a href="/login">Back to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var token = document.getElementById('resetToken').value;
    var pwd = document.getElementById('newPassword').value;
    var confirm = document.getElementById('confirmPassword').value;
    var msg = document.getElementById('resetMsg');
    
    if (pwd !== confirm) {
        msg.innerHTML = '<div class="alert alert-danger">Passwords do not match</div>';
        return;
    }
    
    if (pwd.length < 8) {
        msg.innerHTML = '<div class="alert alert-danger">Password must be at least 8 characters</div>';
        return;
    }
    
    msg.innerHTML = '<div class="alert alert-info">Resetting password...</div>';
    
    try {
        var response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token: token, new_password: pwd})
        });
        var result = await response.json();
        
        if (result.status === 'success') {
            msg.innerHTML = '<div class="alert alert-success">✅ Password reset successfully! <a href="/login">Login now</a></div>';
        } else {
            msg.innerHTML = '<div class="alert alert-danger">' + result.message + '</div>';
        }
    } catch (error) {
        msg.innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
    }
});
</script>
{% endblock %}
