{% extends "base.html" %}
{% block title %}Reset Password - Charvak{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow">
                <h3 class="text-center mb-3">🔐 Reset Password</h3>
                <p class="text-muted text-center">Enter your new password below</p>
                <form id="resetForm">
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control" id="newPassword" required minlength="8" placeholder="Minimum 8 characters">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" required minlength="8" placeholder="Re-enter password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill" id="resetBtn">Reset Password</button>
                </form>
                <div id="resetMsg" class="mt-3 text-center"></div>
                <p class="text-center mt-3">
                    <a href="/login">← Back to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Read token from URL query string
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    
    var msg = document.getElementById('resetMsg');
    var form = document.getElementById('resetForm');
    
    console.log('Token from URL:', token ? token.substring(0, 20) + '...' : 'NONE');
    
    if (!token) {
        msg.innerHTML = '<div class="alert alert-danger">❌ No reset token found. Please use the link from your email.<br><br><a href="/forgot-password" class="btn btn-primary btn-sm">Request New Link</a></div>';
        form.style.display = 'none';
        return;
    }
    
    // Validate token with server
    fetch('/api/auth/verify-reset-token?token=' + encodeURIComponent(token))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.status !== 'success') {
                msg.innerHTML = '<div class="alert alert-danger">❌ ' + data.message + '<br><br><a href="/forgot-password" class="btn btn-primary btn-sm">Request New Link</a></div>';
                form.style.display = 'none';
            }
        })
        .catch(function(e) {
            console.log('Token verify failed (continuing):', e);
        });
    
    // Handle form submission
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        var pwd = document.getElementById('newPassword').value;
        var confirm = document.getElementById('confirmPassword').value;
        var btn = document.getElementById('resetBtn');
        
        if (pwd !== confirm) {
            msg.innerHTML = '<div class="alert alert-danger">Passwords do not match</div>';
            return;
        }
        
        if (pwd.length < 8) {
            msg.innerHTML = '<div class="alert alert-danger">Password must be at least 8 characters</div>';
            return;
        }
        
        btn.disabled = true;
        btn.textContent = 'Resetting...';
        msg.innerHTML = '<div class="alert alert-info">Resetting password...</div>';
        
        try {
            var response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: token, new_password: pwd})
            });
            var result = await response.json();
            
            if (result.status === 'success') {
                msg.innerHTML = '<div class="alert alert-success">✅ Password reset successfully!<br><br><a href="/login" class="btn btn-success btn-sm">Login Now</a></div>';
                form.style.display = 'none';
            } else {
                msg.innerHTML = '<div class="alert alert-danger">❌ ' + result.message + '</div>';
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        } catch (error) {
            msg.innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
            btn.disabled = false;
            btn.textContent = 'Reset Password';
        }
    });
});
</script>
{% endblock %}
