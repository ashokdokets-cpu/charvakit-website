{% extends "base.html" %}
{% block title %}Reported Questions - Admin{% endblock %}
{% block content %}
<style>
  .rq-wrap { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
  .rq-head { margin-bottom: 24px; }
  .rq-head h1 { font-weight: 800; margin-bottom: 6px; }
  .rq-head p { color: #6b7280; margin: 0; }
  .rq-toolbar { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .rq-stat { font-size: 1.15rem; font-weight: 700; color: #111827; }
  .rq-table { width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
  .rq-table thead { background: #f9fafb; }
  .rq-table th { padding: 12px; text-align: left; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7280; font-weight: 600; border-bottom: 1px solid #e5e7eb; }
  .rq-table td { padding: 14px 12px; border-bottom: 1px solid #f3f4f6; vertical-align: top; font-size: 0.9rem; }
  .rq-table tr:last-child td { border-bottom: none; }
  .rq-table tr:hover { background: #fafafa; }
  .rq-qid { font-family: 'SF Mono', Menlo, monospace; font-size: 0.75rem; color: #9ca3af; }
  .rq-exam { font-weight: 600; color: #374151; }
  .rq-topic { font-size: 0.75rem; color: #9ca3af; }
  .rq-qtext { color: #111827; max-width: 400px; }
  .rq-options { font-size: 0.78rem; color: #6b7280; margin-top: 6px; }
  .rq-opt-correct { color: #059669; font-weight: 600; }
  .rq-reason { background: #fef2f2; border-left: 3px solid #dc2626; padding: 8px 12px; border-radius: 4px; font-size: 0.82rem; color: #7f1d1d; max-width: 260px; }
  .rq-reporter { font-size: 0.8rem; color: #6b7280; }
  .rq-date { font-size: 0.75rem; color: #9ca3af; }
  .rq-actions { white-space: nowrap; }
  .rq-actions button { margin-right: 4px; }
  .rq-empty { text-align: center; padding: 60px 20px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; color: #6b7280; }
  .rq-empty h3 { font-weight: 700; color: #111827; margin-bottom: 8px; }
  .rq-loading { text-align: center; padding: 40px; color: #6b7280; }
</style>

<div class="rq-wrap">
  <div class="rq-head">
    <h1>Reported Questions</h1>
    <p>User-reported issues with practice questions. Review, dismiss, or delete.</p>
  </div>

  <div class="rq-toolbar">
    <div>
      <span class="rq-stat" id="pendingCount">0</span>
      <span class="text-muted"> pending reports</span>
    </div>
    <div>
      <button class="btn btn-sm btn-outline-secondary" onclick="loadReports()">↻ Refresh</button>
    </div>
  </div>

  <div id="content" class="rq-loading">Loading…</div>
</div>

<script>
async function loadReports() {
  var content = document.getElementById('content');
  content.className = 'rq-loading';
  content.textContent = 'Loading…';

  try {
    var r = await fetch('/api/admin/reported-questions');
    if (r.status === 401 || r.status === 403) {
      content.className = '';
      content.innerHTML = '<div class="rq-empty"><h3>Not authorized</h3><p>Admin access required. <a href="/admin-login">Log in as admin</a></p></div>';
      return;
    }
    var j = await r.json();
    if (j.status !== 'success') {
      content.className = '';
      content.innerHTML = '<div class="rq-empty"><h3>Error</h3><p>' + esc(j.message || 'Could not load reports') + '</p></div>';
      return;
    }

    document.getElementById('pendingCount').textContent = j.count || 0;

    if (!j.questions || !j.questions.length) {
      content.className = '';
      content.innerHTML = '<div class="rq-empty"><h3>No reported questions</h3><p>All clear. Nothing to review right now.</p></div>';
      return;
    }

    var html = '<table class="rq-table"><thead><tr>' +
      '<th>Question</th>' +
      '<th>Report</th>' +
      '<th>Actions</th>' +
      '</tr></thead><tbody>';

    j.questions.forEach(function(q) {
      html += '<tr>';
      html += '<td>';
      html += '<div class="rq-exam">' + esc(q.exam_id) + ' <span class="rq-topic">/ ' + esc(q.topic) + '</span></div>';
      html += '<div class="rq-qid">' + esc(q.question_id) + '</div>';
      html += '<div class="rq-qtext mt-1">' + esc(q.question_text) + '</div>';
      html += '<div class="rq-options">';
      (q.options || []).forEach(function(o, i) {
        var marker = (i === q.correct_index) ? ' class="rq-opt-correct"' : '';
        html += '<div' + marker + '>' + String.fromCharCode(65 + i) + ') ' + esc(o) + (i === q.correct_index ? ' ✓' : '') + '</div>';
      });
      html += '</div>';
      if (q.explanation) {
        html += '<div class="text-muted mt-1" style="font-size:0.8rem"><em>Explanation: ' + esc(q.explanation) + '</em></div>';
      }
      html += '</td>';

      html += '<td>';
      html += '<div class="rq-reason">' + esc(q.report_reason) + '</div>';
      html += '<div class="rq-reporter mt-2">By: ' + esc(q.reported_by) + '</div>';
      html += '<div class="rq-date">' + formatDate(q.reported_at) + '</div>';
      html += '</td>';

      html += '<td class="rq-actions">';
      html += '<button class="btn btn-sm btn-outline-secondary" onclick="dismissReport(\'' + esc(q.question_id) + '\')">Dismiss</button>';
      html += '<button class="btn btn-sm btn-outline-danger" onclick="deleteQuestion(\'' + esc(q.question_id) + '\')">Delete</button>';
      html += '</td>';
      html += '</tr>';
    });

    html += '</tbody></table>';
    content.className = '';
    content.innerHTML = html;
  } catch (e) {
    content.className = '';
    content.innerHTML = '<div class="rq-empty"><h3>Network error</h3><p>' + esc(e.message) + '</p></div>';
  }
}

async function dismissReport(qid) {
  if (!confirm('Dismiss report for ' + qid + '?\nThe question stays in the bank.')) return;
  try {
    var r = await fetch('/api/admin/reported-questions/' + encodeURIComponent(qid) + '/dismiss', {method: 'POST'});
    var j = await r.json();
    if (j.status === 'success') {
      loadReports();
    } else {
      alert('Failed: ' + (j.message || 'unknown'));
    }
  } catch (e) {
    alert('Network error: ' + e.message);
  }
}

async function deleteQuestion(qid) {
  if (!confirm('DELETE question ' + qid + '?\n\nThis removes it from the bank permanently.')) return;
  if (!confirm('Are you sure? This cannot be undone.')) return;
  try {
    var r = await fetch('/api/admin/reported-questions/' + encodeURIComponent(qid) + '/delete', {method: 'POST'});
    var j = await r.json();
    if (j.status === 'success') {
      loadReports();
    } else {
      alert('Failed: ' + (j.message || 'unknown'));
    }
  } catch (e) {
    alert('Network error: ' + e.message);
  }
}

function formatDate(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

document.addEventListener('DOMContentLoaded', loadReports);
</script>
{% endblock %}
