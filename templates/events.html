{% extends "base.html" %}
{% block title %}Career Events - Charvak IT Consulting{% endblock %}
{% block content %}
<div class="page-hero bg-gradient-primary text-white py-5">
    <div class="container py-4 text-center">
        <h1 class="display-4 fw-bold">🎯 Career Events</h1>
        <p class="lead">Career fairs, webinars, workshops & info sessions</p>
    </div>
</div>

<!-- CREATE EVENT FORM -->
<div class="container py-4">
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h5>Create an Event</h5>
            <form onsubmit="createEvent(event)">
                <div class="row g-3">
                    <div class="col-md-6"><input type="text" class="form-control" id="eventTitle" placeholder="Event Title" required></div>
                    <div class="col-md-6">
                        <select class="form-select" id="eventType">
                            <option value="career_fair">Career Fair</option>
                            <option value="webinar">Webinar</option>
                            <option value="info_session">Info Session</option>
                            <option value="workshop">Workshop</option>
                        </select>
                    </div>
                    <div class="col-md-6"><input type="datetime-local" class="form-control" id="eventDate" required></div>
                    <div class="col-md-6"><input type="number" class="form-control" id="eventDuration" placeholder="Duration (minutes)" value="60"></div>
                    <div class="col-md-6"><input type="text" class="form-control" id="eventPlatform" placeholder="Platform (Zoom/Meet/Teams)"></div>
                    <div class="col-md-6"><input type="number" class="form-control" id="eventMaxAttendees" placeholder="Max Attendees" value="100"></div>
                    <div class="col-12"><textarea class="form-control" id="eventDescription" rows="2" placeholder="Description"></textarea></div>
                    <div class="col-12"><button class="btn btn-primary" type="submit">Create Event</button></div>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container py-5">
    <div class="row" id="eventList">
        <p class="text-muted text-center">No upcoming events. Check back soon!</p>
    </div>
</div>
<script>
fetch('/api/events')
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success' && data.events.length > 0) {
            document.getElementById('eventList').innerHTML = data.events.map(e => `
                <div class="col-md-6 mb-4">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <span class="badge bg-primary mb-2">${e.event_type}</span>
                            <h5>${e.title}</h5>
                            <p class="text-muted small">${e.description}</p>
                            <hr>
                            <p class="mb-2"><i class="bi bi-calendar me-2"></i>${e.date}</p>
                            <p class="mb-2"><i class="bi bi-people me-2"></i>${e.rsvp_count}/${e.max_attendees} registered</p>
                            <button class="btn btn-primary btn-sm w-100" onclick="rsvpEvent('${e.event_id}')">RSVP Now</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    });

function rsvpEvent(eventId) {
    fetch('/api/events/rsvp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            event_id: eventId,
            user_id: localStorage.getItem('charvak_user_id') || 'USER-001',
            user_name: 'User',
            user_email: 'user@email.com',
            user_type: 'student'
        })
    })
    .then(res => res.json())
    .then(data => alert(data.message || 'RSVP confirmed!'));
}
</script>
<script>
async function createEvent(e) {
    e.preventDefault();
    const data = {
        title: document.getElementById('eventTitle').value,
        event_type: document.getElementById('eventType').value,
        date: document.getElementById('eventDate').value,
        duration_minutes: parseInt(document.getElementById('eventDuration').value),
        platform: document.getElementById('eventPlatform').value || 'zoom',
        max_attendees: parseInt(document.getElementById('eventMaxAttendees').value),
        description: document.getElementById('eventDescription').value,
        organizer_name: 'Charvak'
    };
    const resp = await fetch('/api/events/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    const result = await resp.json();
    alert(result.message || 'Event created!');
    location.reload();
}
</script>
<script>
function registerForEvent(event) {
    event.preventDefault();
    const email = prompt('Enter your email:');
    if (!email) return;
    processCharvakPayment(email, 499, 'Event Registration', function(response) {
        alert('✅ Event registration confirmed!');
    });
}
</script>
{% endblock %}
