<script>
// Universal Currency Updater ? delegates to CharvakCurrency for the single source of truth.
(function() {
    function refresh() {
        if (typeof CharvakCurrency === 'undefined') return;
        CharvakCurrency.updateAllPrices();
    }

    // On load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', refresh);
    } else {
        refresh();
    }

    // React to currency changes
    window.addEventListener('charvakCurrencyChanged', refresh);
    window.addEventListener('storage', function(e) {
        if (e.key === 'charvak_currency') refresh();
    });
})();
</script>
