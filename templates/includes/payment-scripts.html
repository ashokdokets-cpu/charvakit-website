<!-- Razorpay -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<!-- PayPal -->
<script>
// Dynamically load PayPal SDK with client ID from backend
fetch('/api/payment/status')
    .then(res => res.json())
    .then(data => {
        if (data.paypal && data.mode === 'live') {
            const script = document.createElement('script');
            script.src = 'https://www.paypal.com/sdk/js?client-id=' + data.paypal_client_id + '&currency=INR';
            document.head.appendChild(script);
        }
    });
</script>

<!-- UPI Payment -->
<div id="upiSection" style="display:none;">
    <h6>Pay via UPI</h6>
    <p>Scan QR or pay to UPI ID: <strong>{{ UPI_ID }}</strong></p>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa={{ UPI_ID }}&pn=CharvakITConsulting" alt="UPI QR">
    <p class="small">Or use any UPI app and send to <strong>{{ UPI_ID }}</strong></p>
</div>

<script>
function showUPI() {
    document.getElementById('upiSection').style.display = 'block';
}

async function processToolPayment(amount, name, callback) {
    const currency = localStorage.getItem('charvak_currency') || 'INR';
    
    let method = 'razorpay';
    
    if (currency === 'INR') {
        // India — Razorpay only
        method = 'razorpay';
    } else {
        // Global — show both Razorpay and PayPal
        const choice = confirm(
            'Choose Payment Method:\n\n' +
            'OK = Razorpay (Cards, UPI, NetBanking)\n' +
            'Cancel = PayPal (International)'
        );
        method = choice ? 'razorpay' : 'paypal';
    }

    try {
        const response = await fetch('/api/payment/create-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount, name, method })
        });
        const order = await response.json();

        if (order.status !== 'success') {
            alert('Payment setup failed. Please try again.');
            callback(false);
            return;
        }

        if (method === 'razorpay') {
            processRazorpay(order, callback);
        } else if (method === 'paypal') {
            processPayPal(order, callback);
        }
    } catch (e) {
        console.error('Payment error:', e);
        alert('Payment failed. Please try again.');
        callback(false);
    }
}

// Fetch Razorpay key from backend
fetch('/api/payment/status')
    .then(res => res.json())
    .then(data => {
        if (data.razorpay_key_id) {
            window.charvak_razorpay_key = data.razorpay_key_id;
        }
    });
function processRazorpay(order, callback) {
    const options = {
        key: order.key_id || window.charvak_razorpay_key || '',
        amount: order.amount,
        currency: order.currency || 'INR',
        name: 'Charvak IT Consulting',
        description: 'AI Tool Unlock',
        order_id: order.order_id,
        handler: async function(response) {
            // Verify payment on backend
            const verifyResp = await fetch('/api/payment/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    method: 'razorpay',
                    payment_id: response.razorpay_payment_id,
                    order_id: response.razorpay_order_id,
                    signature: response.razorpay_signature
                })
            });
            const verifyData = await verifyResp.json();
            callback(verifyData.verified, response);
        },
        prefill: { email: 'user@email.com' },
        theme: { color: '#3ba591' }
    };
    const rzp = new Razorpay(options);
    rzp.open();
}

function processPayPal(order, callback) {
    // Create container for PayPal button
    let container = document.getElementById('paypal-button-container');
    if (!container) {
        container = document.createElement('div');
        container.id = 'paypal-button-container';
        container.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10000;background:#fff;padding:20px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.4);';
        document.body.appendChild(container);
    }
    container.innerHTML = '<h5 class="mb-3">Pay with PayPal</h5>';
    
    paypal.Buttons({
        createOrder: function(data, actions) {
            return actions.order.create({
                purchase_units: [{
                    amount: { value: order.amount }
                }]
            });
        },
        onApprove: async function(data, actions) {
            const verifyResp = await fetch('/api/payment/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    method: 'paypal',
                    order_id: order.order_id,
                    paypal_order_id: data.orderID
                })
            });
            const verifyData = await verifyResp.json();
            callback(verifyData.verified, data);
        }
    }).render('#paypal-button-container');
}
</script>
