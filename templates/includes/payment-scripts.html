<!-- Razorpay -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<!-- PayPal -->
<script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=INR"></script>

<!-- UPI Payment -->
<div id="upiSection" style="display:none;">
    <h6>Pay via UPI</h6>
    <p>Scan QR or pay to UPI ID: <strong>charvakit@upi</strong></p>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=charvakit@upi&pn=CharvakITConsulting" alt="UPI QR">
    <p class="small">Or use any UPI app and send to <strong>charvakit@upi</strong></p>
</div>

<script>
function showUPI() {
    document.getElementById('upiSection').style.display = 'block';
}

// Detect user country for payment method
function getPreferredPayment() {
    const currency = localStorage.getItem('charvak_currency') || 'INR';
    if (currency === 'INR') return 'razorpay';
    return 'paypal';
}

function processPayment(amount, name, callback) {
    const method = getPreferredPayment();
    if (method === 'razorpay') {
        processRazorpay(amount, name, callback);
    } else {
        processPayPal(amount, name, callback);
    }
}

function processRazorpay(amount, name, callback) {
    const options = {
        key: 'YOUR_RAZORPAY_KEY_ID',
        amount: amount * 100,
        currency: 'INR',
        name: 'Charvak IT Consulting',
        description: name,
        handler: function(response) { callback(true, response); },
        prefill: { email: 'user@email.com' },
        theme: { color: '#3ba591' }
    };
    const rzp = new Razorpay(options);
    rzp.open();
}

function processPayPal(amount, name, callback) {
    alert('PayPal payment: ' + name + ' - $' + (amount/83).toFixed(2));
    callback(true, {});
}
</script>
