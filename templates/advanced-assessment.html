<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Assessment - Charvak</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 60px 0; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); transition: all 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
        .icon-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 15px; }
        .btn-custom { background: #3ba591; color: white; border-radius: 50px; padding: 10px 30px; font-weight: 600; border: none; }
    </style>
</head>
<body>
    <div class="hero text-center">
        <h1 class="display-4 fw-bold">🎯 Advanced Assessment</h1>
        <p class="lead">AI-Driven Placement Preparation</p>
    </div>

    <div class="container py-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-4 text-center h-100">
                    <div class="icon-circle" style="background:#e8f5e9; color:#2e7d32;"><i class="bi bi-mic"></i></div>
                    <h4 class="fw-bold">🗣️ Versant</h4>
                    <p class="text-muted">English communication test</p>
                    <a href="/versant" class="btn btn-custom w-100">Start</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center h-100">
                    <div class="icon-circle" style="background:#e3f2fd; color:#1565c0;"><i class="bi bi-pencil-square"></i></div>
                    <h4 class="fw-bold">📝 MCQ</h4>
                    <p class="text-muted">AI-generated questions</p>
                    <a href="/mcq" class="btn btn-custom w-100">Start</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center h-100">
                    <div class="icon-circle" style="background:#fff3e0; color:#e65100;"><i class="bi bi-building"></i></div>
                    <h4 class="fw-bold">🏢 Companies</h4>
                    <p class="text-muted">Mock drives</p>
                    <a href="/company-patterns" class="btn btn-custom w-100">View</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
