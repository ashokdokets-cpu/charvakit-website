{% extends "base.html" %}
{% block title %}Inbox - Charvak IT Consulting{% endblock %}
{% block content %}
<div class="page-hero bg-gradient-primary text-white py-5">
    <div class="container py-4">
        <h1 class="display-4 fw-bold">📬 Inbox</h1>
        <p class="lead">Your messages and conversations</p>
    </div>
</div>
<div class="container py-5">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5 class="mb-3">Your Conversations</h5>
                    <div id="conversationList">
                        <p class="text-muted text-center">No conversations yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
const userId = localStorage.getItem('charvak_user_id') || 'CAND-TEST';
fetch('/api/messaging/inbox/' + userId)
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success' && data.conversations.length > 0) {
            document.getElementById('conversationList').innerHTML = data.conversations.map(c => `
                <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
                    <div>
                        <strong>${c.participants.filter(p => p !== userId)[0]}</strong><br>
                        <small class="text-muted">${c.last_message.body ? c.last_message.body.substring(0, 60) + '...' : ''}</small>
                    </div>
                    <span class="badge bg-primary">${c.unread_count > 0 ? c.unread_count + ' new' : ''}</span>
                </div>
            `).join('');
        }
    });
</script>
<!-- COMPOSE MESSAGE -->
<div class="container py-4">
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h5>Send a Message</h5>
            <form onsubmit="sendMessage(event)">
                <div class="row g-3">
                    <div class="col-md-6"><input type="text" class="form-control" id="recipientId" placeholder="Recipient ID (e.g. CAND-001)" required></div>
                    <div class="col-md-6"><input type="text" class="form-control" id="subject" placeholder="Subject"></div>
                    <div class="col-12"><textarea class="form-control" id="messageBody" rows="3" placeholder="Type your message..." required></textarea></div>
                    <div class="col-12"><button class="btn btn-primary" type="submit">Send Message</button></div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
async function sendMessage(e) {
    e.preventDefault();
    const userId = localStorage.getItem('charvak_user_id') || 'CAND-001';
    const data = {
        sender_id: userId,
        sender_type: 'candidate',
        recipient_id: document.getElementById('recipientId').value,
        recipient_type: 'employer',
        subject: document.getElementById('subject').value || 'New Message',
        body: document.getElementById('messageBody').value
    };
    const resp = await fetch('/api/messaging/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    const result = await resp.json();
    alert(result.message || 'Message sent!');
    location.reload();
}
</script>
{% endblock %}
